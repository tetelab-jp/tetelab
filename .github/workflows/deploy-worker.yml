name: Deploy SALON BOARD worker to ECS/Fargate

# worker/ 配下(SALON BOARD投稿を実行するFargateワーカー)が変更されたときだけ、
# Dockerイメージをビルドし、ECRへpushして、ECSタスク定義の新しいリビジョンを登録する。
# タスク定義はfamily名(リビジョン固定ではない)でアプリ本体(src/lib/aws-ecs.ts)から
# 参照される想定のため、ここで新しいリビジョンをACTIVEにするだけでアプリ側の変更は不要。
#
# 前提(infra/ のTerraformで作成済み):
#   - ECRリポジトリ・ECSクラスタ・タスク定義(初回リビジョン)
#   - このワークフロー用のOIDC IAMロール(secrets.AWS_DEPLOY_ROLE_ARN、
#     infra/のoutput "github_actions_deploy_role_arn"の値)
# 下のenvはリソース名(非機密情報)なので、terraform applyの出力に合わせて
# ここに直接書く(secretsにはAWS_DEPLOY_ROLE_ARNのみで足りる)。

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

# 2026-08-13追記(監査指摘の是正): deploy-app.ymlには既にあるのに、こちらには
# 並行実行制御が無かった。短時間に複数コミットがpushされると複数ジョブが
# 並行し、「現在のタスク定義をdescribeして新リビジョンを登録」する処理の
# 完了順がpushの順序と一致しない場合、古いコミットのイメージが最新リビジョン
# として残ってしまう恐れがあった。
concurrency:
  group: deploy-worker
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: salonboard-worker
  ECS_TASK_FAMILY: salonboard-worker
  ECS_CONTAINER_NAME: worker

permissions:
  id-token: write # OIDCでAWS認証するために必要
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" worker/
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            > task-definition.json

      - name: Render new task definition with the built image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Register new task definition revision
        run: |
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            "${{ steps.render-task-def.outputs.task-definition }}" > clean-task-definition.json
          aws ecs register-task-definition --cli-input-json file://clean-task-definition.json
