name: Deploy TETE AOUT app to ECS/Fargate

# アプリ本体(管理画面・API)が変更されたときに、Dockerイメージをビルドし
# ECRへpushして、ECSタスク定義の新しいリビジョンを登録した上で、
# 常時稼働のECSサービスへforce-new-deploymentする。
#
# 前提(infra/ のTerraformで作成済み):
#   - ECRリポジトリ(app用)・ECSクラスタ・タスク定義(初回リビジョン)・ECSサービス
#   - deploy-worker.ymlと共用のOIDC IAMロール(secrets.AWS_DEPLOY_ROLE_ARN、
#     infra/のoutput "github_actions_deploy_role_arn"の値)
# 下のenvはリソース名(非機密情報)なので、terraform applyの出力に合わせて
# ここに直接書く(secretsにはAWS_DEPLOY_ROLE_ARNのみで足りる)。

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'migrations-pg/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'Dockerfile'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch: {}

# 同じappサービスへのデプロイが並行して走らないようにキュー化する。
# 2つのPRがほぼ同時にmainへマージされても、先行デプロイの完了を待ってから
# 後続が走る(cancel-in-progress: false = 途中キャンセルせず順番に実行)。
concurrency:
  group: deploy-app
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: salonboard-worker-app
  ECS_TASK_FAMILY: salonboard-worker-app
  ECS_CONTAINER_NAME: app
  ECS_CLUSTER: salonboard-worker
  ECS_SERVICE: salonboard-worker-app
  # infra/ecs-app.tfのaws_ecs_task_definition.appはlifecycle.ignore_changesで
  # container_definitionsの差分を無視する設定になっており、ドメイン設定後に
  # terraform applyしてもAPP_BASE_URL(Fargateワーカーへのコールバック先)が
  # 更新されない。デプロイの度にここで正しい値に上書きする。
  APP_BASE_URL: https://salonmotion.com
  # /admin/status の連続失敗検知アラート用SNSトピックARN(infra/monitoring.tf、
  # 非機密情報)。同じくlifecycle.ignore_changesの都合で、既存タスク定義には
  # 含まれていないため、下のステップで無ければ追加する。
  SNS_ALERT_TOPIC_ARN: arn:aws:sns:ap-northeast-1:102798329434:salonboard-worker-alerts
  # 2026-08-14追記(重大バグ修正): NATゲートウェイ導入時、worker用の専用
  # プライベートサブネット(subnet-06aeffd3665aec13a)にECS_SUBNET_IDSを
  # 一時的に上書きしていたが、NATゲートウェイ撤去に伴いこのサブネット自体を
  # terraform destroyで削除した。ECS_SUBNET_IDSを上書きするステップ自体は
  # 撤去時に削除したが、既存タスク定義には削除済みサブネットIDが値として
  # 残ったままカーリーオーバーし続け、以後のRunTask(手動投稿含む)が
  # 全て「サブネットが存在しない」エラーで失敗する不具合が発生した
  # (infra/ecs-app.tfのlifecycle.ignore_changesにより、Terraform側の
  # 正しい値も既存タスク定義には反映されない)。デフォルトVPCの
  # パブリックサブネット(nat-gateway.tf撤去前にNATゲートウェイ自体が
  # 使っていた実在サブネットで確認済み)へ明示的に戻す。
  ECS_SUBNET_IDS: subnet-0bc262c8c71215530

permissions:
  id-token: write # OIDCでAWS認証するために必要
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            > task-definition.json

      # infra/ecs-app.tfのlifecycle.ignore_changes=[container_definitions]により、
      # Terraform側でsecrets配列からAWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEYを
      # 削除しても既存タスク定義には反映されない(このワークフローが実質的な
      # 管理者のため)。発行元のSecrets Managerシークレット自体は既に削除済みで、
      # 参照が残ったままだと新しいタスクの起動時にResourceNotFoundExceptionで
      # 失敗し続ける(実機で確認済みの不具合)。取り除いておく。
      - name: Remove obsolete AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY secrets
        run: |
          jq --arg name "$ECS_CONTAINER_NAME" '
            .containerDefinitions |= map(
              if .name == $name then
                .secrets = ((.secrets // []) | map(select(.name != "AWS_ACCESS_KEY_ID" and .name != "AWS_SECRET_ACCESS_KEY")))
              else . end
            )
          ' task-definition.json > task-definition.fixed.json
          mv task-definition.fixed.json task-definition.json

      - name: Fix APP_BASE_URL environment variable
        run: |
          jq --arg name "$ECS_CONTAINER_NAME" --arg url "$APP_BASE_URL" '
            .containerDefinitions |= map(
              if .name == $name then
                .environment |= map(if .name == "APP_BASE_URL" then .value = $url else . end)
              else . end
            )
          ' task-definition.json > task-definition.fixed.json
          mv task-definition.fixed.json task-definition.json

      # APP_BASE_URLと違い、SNS_ALERT_TOPIC_ARNは古いタスク定義には
      # そもそも存在しないため、無ければ追加・あれば更新の両方に対応する。
      - name: Fix SNS_ALERT_TOPIC_ARN environment variable
        run: |
          jq --arg name "$ECS_CONTAINER_NAME" --arg arn "$SNS_ALERT_TOPIC_ARN" '
            .containerDefinitions |= map(
              if .name == $name then
                .environment = (
                  (.environment // []) as $existing |
                  ($existing | map(.name)) as $names |
                  (if ($names | index("SNS_ALERT_TOPIC_ARN"))
                    then ($existing | map(if .name == "SNS_ALERT_TOPIC_ARN" then .value = $arn else . end))
                    else $existing + [{name: "SNS_ALERT_TOPIC_ARN", value: $arn}]
                  end)
                )
              else . end
            )
          ' task-definition.json > task-definition.fixed.json
          mv task-definition.fixed.json task-definition.json

      # ECS_SUBNET_IDSにNATゲートウェイ導入時代の(既に削除済みの)プライベート
      # サブネットIDが残ったままカーリーオーバーし続ける不具合の是正
      # (このファイル冒頭のenv.ECS_SUBNET_IDSのコメント参照)。
      - name: Fix ECS_SUBNET_IDS environment variable
        run: |
          jq --arg name "$ECS_CONTAINER_NAME" --arg subnetId "$ECS_SUBNET_IDS" '
            .containerDefinitions |= map(
              if .name == $name then
                .environment = (
                  (.environment // []) as $existing |
                  ($existing | map(.name)) as $names |
                  (if ($names | index("ECS_SUBNET_IDS"))
                    then ($existing | map(if .name == "ECS_SUBNET_IDS" then .value = $subnetId else . end))
                    else $existing + [{name: "ECS_SUBNET_IDS", value: $subnetId}]
                  end)
                )
              else . end
            )
          ' task-definition.json > task-definition.fixed.json
          mv task-definition.fixed.json task-definition.json

      # infra/ecs-app.tfのlifecycle.ignore_changesにより、Terraform側で
      # secrets配列にADMIN_JWT_SECRET/ADMIN_INITIAL_PASSWORDを追加しても
      # 既存タスク定義には反映されない(APP_BASE_URLと同じ問題)。
      # 未登録の場合のみ追加する(既に存在する場合は上書きしない)。
      # このPRのマージ直後はterraform applyがまだ行われておらず、
      # 対象のSecrets Managerシークレット自体が存在しない可能性があるため、
      # 見つからない場合はこのステップをスキップし(デプロイ全体は失敗させない)、
      # admin機能以外の通常のデプロイに影響が出ないようにする。
      - name: Add admin secrets if missing
        run: |
          ADMIN_JWT_SECRET_ARN=$(aws secretsmanager describe-secret --secret-id "salonboard-worker/admin-jwt-secret" --query ARN --output text 2>/dev/null || echo "")
          ADMIN_INITIAL_PASSWORD_ARN=$(aws secretsmanager describe-secret --secret-id "salonboard-worker/admin-initial-password" --query ARN --output text 2>/dev/null || echo "")
          if [ -z "$ADMIN_JWT_SECRET_ARN" ] || [ -z "$ADMIN_INITIAL_PASSWORD_ARN" ]; then
            echo "admin用シークレットが未作成のためスキップします(terraform apply後に反映されます)"
            exit 0
          fi
          jq --arg name "$ECS_CONTAINER_NAME" --arg jwtArn "$ADMIN_JWT_SECRET_ARN" --arg pwArn "$ADMIN_INITIAL_PASSWORD_ARN" '
            .containerDefinitions |= map(
              if .name == $name then
                .secrets = (
                  (.secrets // []) as $existing |
                  ($existing | map(.name)) as $names |
                  $existing
                  + (if ($names | index("ADMIN_JWT_SECRET")) then [] else [{name: "ADMIN_JWT_SECRET", valueFrom: $jwtArn}] end)
                  + (if ($names | index("ADMIN_INITIAL_PASSWORD")) then [] else [{name: "ADMIN_INITIAL_PASSWORD", valueFrom: $pwArn}] end)
                )
              else . end
            )
          ' task-definition.json > task-definition.fixed.json
          mv task-definition.fixed.json task-definition.json

      - name: Render new task definition with the built image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Register new task definition revision
        id: register-task-def
        run: |
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            "${{ steps.render-task-def.outputs.task-definition }}" > clean-task-definition.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://clean-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_definition_arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register-task-def.outputs.task_definition_arn }}" \
            --force-new-deployment

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
